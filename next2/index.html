.composition-tabs{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);background:#090c08;border-radius:4px;margin-bottom:14px}.composition-tabs button{min-height:31px;padding:0 13px;border:0;border-radius:2px;background:transparent;color:var(--muted);font-weight:700}.composition-tabs button.active{background:#171e14;color:var(--text);box-shadow:0 0 0 1px #48553f inset}.composition-grid{display:grid;grid-template-columns:172px minmax(0,1fr);gap:15px}.stanza-editor-header{display:grid;grid-template-columns:minmax(180px,.5fr) minmax(260px,1fr) auto;gap:9px;align-items:end;padding-bottom:12px;border-bottom:1px solid var(--line)}.score-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:17px 0 8px}.score-list,.flow-list{display:grid;gap:7px}.score-slot,.flow-entry{border:1px solid #30392c;background:#0b0f0a;padding:9px;display:grid;align-items:center;gap:9px}.score-slot{grid-template-columns:32px 24px minmax(150px,1fr) minmax(155px,.72fr) minmax(150px,.65fr) auto}.score-slot.breath{grid-template-columns:32px 24px minmax(150px,1fr) auto}.slot-index{font-size:10px;color:#7b836f}.drag-handle{cursor:grab;color:#7b8574;text-align:center;font-size:16px;user-select:none}.dragging{opacity:.42}.slot-title strong{display:block}.slot-title span{display:block;color:var(--muted);font-size:9px;margin-top:2px}.probability{display:grid;grid-template-columns:minmax(70px,1fr) 40px;gap:7px;align-items:center}.probability input[type=range]{width:100%;accent-color:var(--acid)}.probability output{text-align:right;color:var(--muted);font-size:10px}.segment{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line2);background:#080c08}.segment button{min-height:29px;border:0;border-right:1px solid var(--line2);background:transparent;padding:0 8px;color:var(--muted)}.segment button:last-child{border-right:0}.segment button.active{background:#192014;color:var(--text)}.slot-menu .action-menu-box{width:170px}.add-slot{border:1px dashe function markDirty(){state.dirty=true;state.previewFresh=false;persist();updateProjectBar()}

function undo(){const prev=undoStack.pop();if(!prev)return;project=prev;state.dirty=true;repairSelection();persist();render();$('#toast').hidden=true;announce('Last change undone.')}
function repairSelection(){
 if(!bank(state.selectedBankId))state.selectedBankId=project.banks[0]?.id||null;
 if(!material(state.selectedMaterialId))state.selectedMaterialId=bank(state.selectedBankId)?.materials[0]?.id||project.banks.flatMap(b=>b.materials)[0]?.id||null;
 if(!instrument(state.selectedInstrumentId))state.selectedInstrumentId=project.instruments[0]?.id||null;
 if(!stanza(state.selectedStanzaId))state.selectedStanzaId=project.stanzas[0]?.id||null;
 if(!rule(state.selectedRuleId))state.selectedRuleId=project.rules[0]?.id||null;
 if(!flowEntryById(state.selectedFlowId))state.selectedFlowId=project.flow[0]?.id||null;
 if(state.selectedSurfaceId&&!surfaceRecord(state.selectedSurfaceId))state.selectedSurfaceId=null;
 if(state.selectedTakeId&&!take(state.selectedTakeId))state.selectedTakeId=project.takes[0]?.id||null;
}

function applyCase(v){if(project.forms.casePolicy==='upper')return v.toUpperCase();if(project.forms.casePolicy==='lower')return v.toLowerCase();if(project.forms.casePolicy==='title')return v.replace(/\b\w/g,c=>c.toUpperCase());return v}
function formValue(m,key){key=String(key||'literal').trim();const aliases={thirdSingular:'third'},canonical=aliases[key]||key,ov=project.forms.overrides[m.id]?.[key]??project.forms.overrides[m.id]?.[canonical];if(ov)return ['uppercase','lowercase','title'].includes(canonical)?String(ov):applyCase(ov);const base=String(m.literal||'');if(m.lockedLiteral&&!['uppercase','lowercase','title'].includes(canonical))return applyCase(base);if(canonical==='base'||canonical==='literal'||canonical==='singular'||canonical==='imperative')return applyCase(base);if(canonical==='literal+s')return applyCase(base+'s');if(canonical==='capitalize')return applyCase((base.charAt(0).toUpperCase()||'')+base.slice(1));if(canonical==='capitalize+s'){const v=base+'s';return applyCase((v.charAt(0).toUpperCase()||'')+v.slice(1))}if(canonical==='uppercase')return base.toUpperCase();if(canonical==='lowercase')return base.toLowerCase();if(canonical==='title')return base.replace(/\b\w/g,c=>c.toUpperCase());const [prefix,head]=splitLegacyHead(base),low=head.toLowerCase();if(canonical==='plural')return applyCase(prefix+styleLegacyLike(head,pluralLegacyBase(low)));if(canonical==='third')return applyCase(prefix+styleLegacyLike(head,verb3LegacyBase(low)));if(canonical==='possessive')return applyCase(base+"'s");if(canonical==='compound')return applyCase(project.forms.compoundPolicy==='space'?base+' borne':base+'-borne');return applyCase(base)}

function instrumentHeaderValidity(ins){
 const invalidRoutes=ins.routes.filter(r=>!r.template.trim()||unknownVariables(ins,r.template).length),valid=Boolean(ins.inputs.length&&ins.routes.length&&!invalidRoutes.length);
 if(valid)return {valid:true,detail:''};
 if(!ins.inputs.length&&!ins.routes.length)return {valid:false,detail:'Add at least one Input and one Route before this Instrument can perform.'};
 if(!ins.inputs.length)return {valid:false,detail:'Add at least one Input before this Instrument can perform.'};
 if(!ins.routes.length)return {valid:false,detail:'Add at least one Route before this Instrument can perform.'};
 if(invalidRoutes.length===1){const r=invalidRoutes[0],unknown=unknownVariables(ins,r.template);return {valid:false,detail:!r.template.trim()?`Route “${r.name}” has no template. Add text and Input variables.`:`Route “${r.name}” has unresolved Input reference${unknown.length===1?'':'s'}: ${unknown.map(x=>'{'+x+'}').join(', ')}.`}}
 return {valid:false,detail:`${invalidRoutes.length} Routes are invalid. Repair blank templates or unresolved Input references.`};
}
function instrumentValidityBand(ins){const status=instrumentHeaderValidity(ins);if(status.valid)return '';return `<div class="instrument-validity-band" role="status"><span class="instrument-validity-mark" aria-hidden="true">!</span><div><strong>Instrument cannot perform yet</strong><span>${esc(status.detail)}</span></div><div class="instrument-validity-actions"><button class="btn small" data-action="jump-instrument-section" data-target="instrument-inputs">Inputs ↓</button><button class="btn small" data-action="jump-instrument-section" data-target="instrument-routes">Routes ↓</button></div></div>`}
function instrumentEditor(ins){const procedureNote=ins.inputs.some(x=>x.procedure?.kind==='taroko-cave-adjectives')?`<div class="notice source-procedure-note"><strong>SOURCE PROCEDURE · CAVE</strong><span>{adjectives} assembles all CAVE ADJECTIVES with one random TEXTURE inserted after “encompassing”, then keeps a uniformly chosen 1–4 without replacement, preserving source order.</span></div>`:'';return `<div class="instrument-meta"><div class="field"><label>Instrument name</label><input class="input" data-instrument-field="name" value="${esc(ins.name)}"></div><div class="field"><label>Description</label><input class="input" data-instrument-field="description" value="${esc(ins.description)}"></div><div class="entity-actions">${stateToggle('toggle-instrument',ins.enabled,'Instrument enabled')}${moreMenu('Instrument actions',menuSection('Instrument')+`<button class="btn small quiet" data-action="duplicate-instrument">Duplicate Instrument</button>`+menuSection('Destructive')+`<button class="btn small danger" data-action="delete-instrument">Delete Instrument…</button>`)}</div></div>${instrumentValidityBand(ins)}${procedureNote}<section id="instrument-inputs" tabindex="-1" aria-label="Inputs"><div class="section-toolbar"><div><h2 class="section-title">Inputs</h2><div class="section-note">Named variables that receive one Material from a Bank.</div></div><button class="btn small" data-action="add-input">+ Input</button></div>${inputsGrid(ins)}</section><section id="instrument-routes" tabindex="-1" aria-label="Routes"><div class="section-toolbar"><div><h2 class="section-title">Routes</h2><div class="section-note">Text plus Input variables. Weight controls selection among Routes.</div></div><button class="btn small" data-action="add-route">+ Route</button></div><div class="route-list">${ins.routes.map((r,i)=>routeCard(ins,r,i)).join('')||'<div class="empty">Add a Route to make this Instrument speak.</div>'}</div></section>`}
function inputsGrid(ins){return `<div class="input-grid"><div class="input-grid-head"><span>VARIABLE</span><span>BANK</span><span>FORM</span><span></span></div>${ins.inputs.map((x,i)=>`<div class="input-lane ${state.highlightInputId===x.id?'highlight':''}" data-input-id="${x.id}"><div class="field input-name-cell"><label>Variable</label><input class="input variable-name" data-input-field="name" data-index="${i}" value="${esc(x.name)}"></div><div class="field"><label>Bank</label><select class="select" data-input-field="bankId" data-index="${i}">${project.banks.map(b=>`<option value="${b.id}" ${x.bankId===b.id?'selected':''}>${esc(b.label)}</option>`).join('')}</select></div><div class="field"><label>Form</label><select class="select" data-input-field="form" data-index="${i}">${['literal','plural','possessive','compound','third','singular','capitalize','capitalize+s','literal+s','uppercase','lowercase','title','imperative'].map(f=>`<option ${x.form===f?'selected':''}>${f}</option>`).join('')}</select></div><button class="row-direct-action danger" data-action="delete-input" data-index="${i}" aria-label="Remove Input ${esc(x.name)}">Remove</button></div>`).join('')||'<div class="empty">Add an Input before authoring a Route.</div>'}</div>`}
function routeCard(ins,r,i){const unknown=unknownVariables(ins,r.template),test=state.routeTests[r.id];return `<article class="route-card ${state.highlightRouteId===r.id?'highlight':''}" data-route-id="${r.id}"><div class="route-head"><div class="field"><label>Route name</label><input class="input" data-route-field="name" data-index="${i}" value="${esc(r.name)}"></div><div class="field"><label>Weight</label><input class="input" type="number" min="0" max="20" data-route-field="weight" data-index="${i}" value="${r.weight}"></div>${moreMenu('Route actions',menuSection('Route')+`<button class="btn small quiet" data-action="duplicate-route" data-index="${i}">Duplicate Route</button>`+menuSection('Destructive')+`<button class="btn small danger" data-action="delete-route" data-index="${i}">Remove Route</button>`)}</div><div class="route-template-wrap"><div class="field"><label>Template</label><div class="variable-palette"><span class="micro">Insert Input</span>${ins.inputs.map(x=>`<button class="variable-chip" data-action="insert-variable" data-route-id="${r.id}" data-name="${esc(x.name)}">{${esc(x.name)}}</button>`).join('')||'<span class="micro">Add an Input first.</span>'}</div><textarea class="textarea route-template" id="route_${r.id}" data-route-field="template" data-index="${i}">${esc(r.template)}</textarea></div></div><div class="route-footer"><div class="route-validation ${unknown.length?'bad':''}">${unknown.length?`Unresolved Inputs: ${unknown.map(x=>'{'+esc(x)+'}').join(', ')}`:'Route is valid.'}</div><button class="btn small cyan" data-action="test-route" data-index="${i}" ${unknown.length||!r.template.trim()?'disabled':''}>Test Route</button></div>${test?`<div class="test-output"><div class="test-output-label">LOCAL TEST · DOES NOT WRITE TO SURFACE</div><div class="test-output-text">${esc(test)}</div></div>`:''}</article>`}
function unknownVariables(ins,template){const names=[...String(template||'').matchAll(/\{([^}:]+)(?::([^}]+))?\}/g)].map(x=>({name:String(x[1]||'').trim(),form:String(x[2]||'').trim()}));return [...new Set(names.filter(x=>!(x.name==='article'&&x.form==='a')&&!ins.inputs.some(i=>i.name===x.name)).map(x=>x.name+(x.form?':'+x.form:'')))]}
function compositionView(){
 return head('Composition','Build reusable Stanzas, then arrange those Stanzas in the Flow. Sequence belongs here, not in Forms.')+`<div class="composition-tabs"><button class="${state.compositionMode==='stanzas'?'active':''}" data-action="composition-tab" data-mode="stanzas">Stanzas</button><button class="${state.compositionMode==='flow'?'active':''}" data-action="composition-tab" data-mode="flow">Flow</button></div>${state.compositionMode==='stanzas'?stanzasView():flowView()}`;
}
function stanzasView(){const st=stanza(state.selectedStanzaId);if(isNarrow()){if(state.mobilePane==='stanza'&&st)return `<div class="mobile-detail-head"><button class="btn" data-action="mobile-back">← Stanzas</button></div>${stanzaEditor(st)}`;return `<section class="mobile-entity-library"><div class="library-head"><h2 class="section-title">Stanzas</h2><button class="btn small" data-action="new-stanza">+ New</button></div><div class="entity-items">${project.stanzas.map(x=>`<button class="entity-btn ${x.id===state.selectedStanzaId?'active':''}" data-action="select-stanza" data-id="${x.id}"><strong>${esc(x.name)}</strong><span>${x.slots.length} slots · ${x.enabled?'enabled':'off'}</span></button>`).join('')||'<div class="empty">No Stanzas.</div>'}</div></section>`}return `<div class="composition-grid"><aside class="entity-list"><div class="library-head"><h2 class="section-title">Stanzas</h2><button class="btn small" data-action="new-stanza">+ New</button></div><div class="entity-items">${project.stanzas.map(x=>`<button class="entity-btn ${x.id===state.selectedStanzaId?'active':''}" data-action="select-stanza" data-id="${x.id}"><strong>${esc(x.name)}</strong><span>${x.slots.length} slots · ${x.enabled?'enabled':'off'}</span></button>`).join('')||'<div class="empty">No Stanzas.</div>'}</div></aside><section>${st?stanzaEditor(st):'<div class="empty">Create a Stanza.</div>'}</section></div>`}
function stanzaEditor(st){const executable=(st.slots||[]).some(s=>s.type==='instrument'&&!instrumentRuntimeIssue(instrument(s.instrumentId)));return `<div class="stanza-editor-header"><div class="field"><label>Stanza name</label><input class="input" data-stanza-field="name" value="${esc(st.name)}"></div><div class="field"><label>Description</label><input class="input" data-stanza-field="description" value="${esc(st.description)}"></div><div class="entity-actions">${stateToggle('toggle-stanza',st.enabled,'Stanza enabled')}${moreMenu('Stanza actions',menuSection('Stanza')+`<button class="btn small quiet" data-action="duplicate-stanza">Duplicate Stanza</button>`+menuSection('Destructive')+`<button class="btn small danger" data-action="delete-stanza">Delete Stanza…</button>`)}</div></div><div class="score-toolbar"><div><h2 class="section-title">Stanza score</h2><div class="section-note">Drag the handle to reorder. Move commands remain available for precision and keyboard use.</div></div><button class="btn cyan" data-action="test-stanza" ${executable?'':'disabled'} title="${executable?'Generate a local ordered Stanza sample':'No executable Instrument slot can speak'}">Test Stanza</button></div>${!executable?'<div class="notice" style="margin-bottom:8px">No executable Instrument slot can speak. Breath slots remain part of the score, but Test Stanza is unavailable until an Instrument has valid Inputs and a Route.</div>':''}<div class="score-list" id="scoreList">${st.slots.map((slot,i)=>scoreSlot(st,slot,i)).join('')||'<div class="empty">Add the first slot below.</div>'}</div>${addSlotComposer()}${state.stanzaTest?stanzaTestView():''}` }
function scoreSlot(st,s,i){if(s.type==='breath')return `<article class="score-slot breath" data-drag-type="stanza-slot" data-id="${s.id}"><span class="slot-index">${String(i+1).padStart(2,'0')}</span><button class="drag-handle" type="button" aria-label="Drag Breath to reorder">⋮⋮</button><div class="slot-title"><strong>BREATH</strong><span>Temporal interval · no Instrument speaks</span></div>${slotMenu(i)}</article>`;const ins=instrument(s.instrumentId);return `<article class="score-slot" data-drag-type="stanza-slot" data-id="${s.id}"><span class="slot-index">${String(i+1).padStart(2,'0')}</span><button class="drag-handle" type="button" aria-label="Drag ${esc(ins?.name||'Instrument')} to reorder">⋮⋮</button><div class="slot-title"><strong>${esc(ins?.name||'Missing Instrument')}</strong><span>Instrument slot</span></div><div class="probability-cell"><div class="field"><label>Chance</label><div class="probability"><input type="range" min="0" max="100" data-slot-field="chance" data-index="${i}" value="${s.chance}"><output>${s.chance}%</output></div></div></div><div class="repeat-cell"><div class="field"><label>Repeat</label><div class="segment">${[['once','1×'],['twice','2×'],['range',s.repeat==='range'?`${s.repeatMin??0}–${s.repeatMax??2}×`:'0–2×'],['loop',s.legacyLoopMax?`Loop ≤${s.legacyLoopMax}`:'Loop']].map(([v,l])=>`<button class="${s.repeat===v?'active':''}" data-action="set-repeat" data-index="${i}" data-value="${v}">${l}</button>`).join('')}</div></div></div>${slotMenu(i)}</article>`}
function slotMenu(i){const st=stanza(state.selectedStanzaId),last=(st?.slots.length||1)-1;return moreMenu('Slot actions',`<button class="btn small quiet" data-action="move-slot" data-dir="-1" data-index="${i}" ${i===0?'disabled':''}>Move earlier</button><button class="btn small quiet" data-action="move-slot" data-dir="1" data-index="${i}" ${i===last?'disabled':''}>Move later</button><button class="btn small danger" data-action="delete-slot" data-index="${i}">Remove from Stanza</button>`,'slot-menu')}
function addSlotComposer(){const available=project.instruments.filter(i=>i.enabled),hasInstruments=available.length>0,defaultType=hasInstruments?'instrument':'breath';return `<div class="add-slot"><div><h3 class="section-title">Add to Stanza</h3><div class="section-note">Insert an enabled Instrument or a Breath at the end of this score.</div></div><div class="add-slot-controls"><select class="select" id="slotType"><option value="instrument" ${defaultType==='instrument'?'selected':''} ${hasInstruments?'':'disabled'}>Instrument</option><option value="breath" ${defaultType==='breath'?'selected':''}>Breath</option></select><select class="select" id="slotInstrument" ${hasInstruments?'':'disabled hidden'}>${available.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select><button class="btn primary" data-action="add-slot">Add</button></div>${hasInstruments?'':'<div class="notice" style="margin-top:8px">No enabled Instrument is available. You can still add a Breath.</div>'}</div>`}
function stanzaTestView(){return `<section class="stanza-test"><div class="stanza-test-head"><div><div class="eyebrow">PRIVATE TEST</div><h3 class="section-title">One possible ordered pass</h3></div><span class="micro">Does not write to Surface</span></div><div class="stanza-test-lines">${state.stanzaTest.map(x=>x.type==='breath'?'<div class="stanza-test-breath" aria-label="Breath"></div>':x.type==='line'?`<div class="stanza-test-line">${esc(x.text)}</div>`:`<div class="stanza-test-note ${x.type==='error'?'error':x.type==='omitted'?'omitted':''}">${esc(x.text)}</div>`).join('')||'<div class="micro">No slot resolved in this pass.</div>'}</div></section>`}
function flowView(){const canAdd=project.stanzas.length>0;return `<div class="row spread" style="margin-bottom:10px"><div><h2 class="section-title">Flow</h2><div class="section-note">Runtime arrangement of Stanzas. Drag to reorder or use each entry’s menu.</div></div><button class="btn primary" data-action="add-flow" ${canAdd?'':'disabled'} title="${canAdd?'Add a Flow entry':'Create a Stanza before adding it to Flow'}">+ Flow entry</button></div>${canAdd?'':'<div class="notice" style="margin-bottom:8px">Create a Stanza before adding a Flow entry.</div>'}<div class="flow-list" id="flowList">${project.flow.map((f,i)=>flowCard(f,i)).join('')||'<div class="empty">No Flow entries yet.</div>'}</div>`}
function flowCard(f,i){const last=project.flow.length-1;return `<article class="flow-entry" data-drag-type="flow" data-id="${f.id}"><button class="drag-handle" type="button" aria-label="Drag Flow entry to reorder">⋮⋮</button><div class="flow-title field"><label>Entry name</label><input class="input" data-flow-field="name" data-index="${i}" value="${esc(f.name)}"></div><div class="flow-stanza-cell field"><label>Stanza</label><select class="select" data-flow-field="stanzaId" data-index="${i}">${project.stanzas.map(st=>`<option value="${st.id}" ${f.stanzaId===st.id?'selected':''}>${esc(st.name)}</option>`).join('')}</select></div><div class="flow-mode-cell field"><label>Mode</label><div class="segment"><button class="${f.mode==='once'?'active':''}" data-action="set-flow-mode" data-index="${i}" data-value="once">Once</button><button class="${f.mode==='loop'?'active':''}" data-action="set-flow-mode" data-index="${i}" data-value="loop">Loop</button></div></div><div class="flow-chance-cell field"><label>Chance</label><div class="probability"><input type="range" min="0" max="100" data-flow-field="chance" data-index="${i}" value="${f.chance}"><output>${f.chance}%</output></div></div>${moreMenu('Flow entry actions',`<button class="btn small quiet" data-action="toggle-flow" data-index="${i}">${f.enabled?'Disable':'Enable'}</button><button class="btn small quiet" data-action="move-flow" data-dir="-1" data-index="${i}" ${i===0?'disabled':''}>Move earlier</button><button class="btn small quiet" data-action="move-flow" data-dir="1" data-index="${i}" ${i===last?'disabled':''}>Move later</button><button class="btn small danger" data-action="delete-flow" data-index="${i}">Remove from Flow</button>`)}</article>`}
const fieldDefs={
 material:{label:'Material',operators:[['is','is'],['is_not','is not'],['in_bank','belongs to Bank']]},
 bank:{label:'Bank',operators:[['is','is'],['is_not','is not']]},
 instrument:{label:'Instrument',operators:[['is','is'],['is_not','is not']]},
 stanza:{label:'Stanza',operators:[['is','is'],['is_not','is not']]},
 route:{label:'Route',operators:[['is','is'],['is_not','is not']]},
 text:{label:'Generated line',operators:[['contains','contains'],['equals','equals'],['starts','starts with']]},
 runtime:{label:'Runtime',operators:[['every','every N events'],['after','after N events']]}
};
function automationView(){const r=rule(state.selectedRuleId);if(isNarrow()){if(state.mobilePane==='rule'&&r)return head('Rule','Edit a structured no-code Rule.',`<button class="btn" data-action="mobile-back">← Rules</button>`)+ruleEditor(r);return head('Rules','Compose typed conditions, test them against an event, then enable the Rule.',`<button class="btn primary" data-action="new-rule">+ Rule</button>`)+`<section class="mobile-entity-library"><h2 class="section-title">Rules</h2><div class="entity-items">${project.rules.map(x=>`<button class="entity-btn ${x.id===state.selectedRuleId?'active':''}" data-action="select-rule" data-id="${x.id}"><strong>${esc(x.name)}</strong><span>${x.enabled?'enabled':'draft'} · ${x.conditions.length} condition${x.conditions.length===1?'':'s'}</span></button>`).join('')||'<div class="empty">No Rules.</div>'}</div></section>`}return head('Rules','Compose typed conditions, test them against an event, then enable the Rule.',`<button class="btn primary" data-action="new-rule">+ Rule</button>`)+`<div class="rule-layout"><aside class="entity-list"><h2 class="section-title">Rules</h2><div class="entity-items">${project.rules.map(x=>`<button class="entity-btn ${x.id===state.selectedRuleId?'active':''}" data-action="select-rule" data-id="${x.id}"><strong>${esc(x.name)}</strong><span>${x.enabled?'enabled':'draft'} · ${x.conditions.length} condition${x.conditions.length===1?'':'s'}</span></button>`).join('')||'<div class="empty">No Rules.</div>'}</div></aside><section>${r?ruleEditor(r):'<div class="empty">Create a Rule.</div>'}</section></div>`}
function ruleEditor(r){const complete=ruleComplete(r);return `<div class="rule-editor"><div class="rule-titlebar"><div class="field"><label>Rule name</label><input class="input" data-rule-field="name" value="${esc(r.name)}"></div><div class="entity-actions"><span class="state-note">${complete?'Ready':'Incomplete draft'}</span>${stateToggle('toggle-rule',r.enabled,'Rule enabled',!complete&&!r.enabled)}${moreMenu('Rule actions',menuSection('Rule')+`<button class="btn small quiet" data-action="duplicate-rule">Duplicate Rule</button>`+menuSection('Destructive')+`<button class="btn small danger" data-action="delete-rule">Delete Rule</button>`)}</div></div><section class="logic-section"><div class="conditions-toolbar"><div class="conditions-title"><h2 class="section-title">Conditions</h2><span class="logic-token" aria-label="All conditions must match">ALL</span></div><button class="btn small" data-action="add-condition">+ Condition</button></div><div class="condition-list">${r.conditions.map((c,i)=>conditionRow(c,i)).join('')||'<div class="empty">Add at least one condition.</div>'}</div></section><section class="logic-section"><div class="then-row"><span class="join-label">THEN</span><div class="field"><label>Action</label><select class="select" data-action-field="type">${['append','prepend','replace'].map(x=>`<option ${r.action.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Text</label><input class="input" data-action-field="text" value="${esc(r.action.text)}" placeholder="text to apply"></div><div class="field"><label>Chance</label><div class="probability"><input type="range" min="0" max="100" data-rule-field="chance" value="${r.chance}"><output>${r.chance}%</output></div></div></div></section><div class="rule-summary">WHEN ${r.conditions.map(conditionSummary).join(' AND ')||'…'} THEN ${esc(r.action.type)} “${esc(r.action.text||'…')}” with ${r.chance}% chance.</div>${!complete?'<div class="notice" style="margin-top:8px">Add at least one valid condition and action text before enabling this Rule.</div>':''}<div class="row" style="margin-top:9px"><button class="btn cyan" data-action="test-rule" ${!complete?'disabled':''}>Test Rule</button><span class="micro">Uses the selected Surface line, or a representative fixture when Surface is empty. Surface is never changed.</span></div>${state.ruleTest?ruleTestView():''}</div>`}
function conditionRow(c,i){const count=rule(state.selectedRuleId)?.conditions.length||0;return `<div class="condition-row"><span class="join-label">${i?'AND':'WHEN'}</span><div class="field"><label>Field</label><select class="select" data-condition-field="field" data-index="${i}">${Object.entries(fieldDefs).map(([v,d])=>`<option value="${v}" ${c.field===v?'selected':''}>${d.label}</option>`).join('')}</select></div><div class="field"><label>Operator</label><select class="select" data-condition-field="operator" data-index="${i}">${fieldDefs[c.field].operators.map(([v,l])=>`<option value="${v}" ${c.operator===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Value</label>${valueControl(c,i)}</div><button class="row-direct-action danger" data-action="delete-condition" data-index="${i}" aria-label="Remove Condition ${i+1}">Remove</button></div>`}
function valueControl(c,i){
 const attrs=`data-condition-field="value" data-index="${i}"`;
 if(c.field==='material'&&c.operator!=='in_bank')return `<select class="select" ${attrs}>${project.banks.flatMap(b=>b.materials.map(m=>`<option value="${m.id}" ${c.value===m.id?'selected':''}>${esc(b.label)} · ${esc(m.literal)}</option>`)).join('')}</select>`;
 if(c.field==='material'||c.field==='bank')return `<select class="select" ${attrs}>${project.banks.map(b=>`<option value="${b.id}" ${c.value===b.id?'selected':''}>${esc(b.label)}</option>`).join('')}</select>`;
 if(c.field==='instrument')return `<select class="select" ${attrs}>${project.instruments.map(x=>`<option value="${x.id}" ${c.value===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`;
 if(c.field==='stanza')return `<select class="select" ${attrs}>${project.stanzas.map(x=>`<option value="${x.id}" ${c.value===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`;
 if(c.field==='route')return `<select class="select" ${attrs}>${project.instruments.flatMap(ins=>ins.routes.map(x=>`<option value="${x.id}" ${c.value===x.id?'selected':''}>${esc(ins.name)} · ${esc(x.name)}</option>`)).join('')}</select>`;
 if(c.field==='runtime')return `<input class="input" type="number" min="1" ${attrs} value="${esc(c.value||1)}">`;
 return `<input class="input" ${attrs} value="${esc(c.value)}">`;
}
function conditionSummary(c){
 const def=fieldDefs[c.field],op=def.operators.find(x=>x[0]===c.operator)?.[1]||c.operator;let val=c.value;
 if(c.field==='material'&&c.operator!=='in_bank')val=material(c.value)?.literal||'missing Material';else if(c.field==='material'||c.field==='bank')val=bank(c.value)?.label||'missing Bank';else if(c.field==='instrument')val=instrument(c.value)?.name||'missing Instrument';else if(c.field==='stanza')val=stanza(c.value)?.name||'missing Stanza';else if(c.field==='route'){const pair=project.instruments.flatMap(ins=>ins.routes.map(r=>({ins,r}))).find(x=>x.r.id===c.value);val=pair?pair.ins.name+' / '+pair.r.name:'missing Route'}return `${def.label} ${op} ${val}`;
}
function ruleComplete(r){return Boolean(r.conditions.length&&r.action.text.trim()&&r.conditions.every(c=>String(c.value??'').trim()))}
function ruleTestView(){const t=state.ruleTest;return `<section class="rule-test"><div class="row spread"><div><div class="eyebrow">PRIVATE TEST · ${esc(t.source)}</div><h3 class="section-title">${t.fired?'Rule fired':t.matched?'Rule matched · chance skipped':'Rule did not match'}</h3></div><span class="chip ${t.fired?'cyan':t.matched?'amber':'danger'}">${t.fired?'fired':t.matched?'skipped':'failed'}</span></div><div class="micro" style="margin:6px 0">${esc(t.reason)} Chance roll: ${t.roll} / ${t.chance}%. ${t.productionEnabled?'Production Rule is enabled.':'Draft test only: this Rule is disabled and would not fire in production.'}</div><div class="rule-test-grid"><div><div class="eyebrow">ORIGINAL</div><div class="literary">${esc(t.before)}</div></div><div><div class="eyebrow">RESULT</div><div class="literary">${esc(t.after)}</div></div></div></section>`}

  const i=items.indexOf(document.activeElement);if(i>=0){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus()}else if(e.key==='Home'){e.preventDefault();items[0]?.focus()}else if(e.key==='End'){e.preventDefault();items.at(-1)?.focus()}}
 }
 if(e.key==='Escape'&&!$('#mobileMenu').hidden){e.preventDefault();$('#mobileMenu').hidden=true;document.querySelector('[data-action="toggle-mobile-menu"]')?.focus()}
}
function cleanupPointerDrag(){
 document.querySelectorAll('.drop-before,.drop-after,.dragging').forEach(x=>x.classList.remove('drop-before','drop-after','dragging'));
 document.querySelector('.drag-ghost')?.remove();
 if(dragState?.handle&&dragState.pointerId!=null){try{dragState.handle.releasePointerCapture(dragState.pointerId)}catch(e){}}
 dragState=null;
}
function dragItems(type){return [...document.querySelectorAll(`[data-drag-type="${type}"]`)].filter(x=>x.offsetParent!==null)}
function pointerDragDown(e){
 const h=e.target.closest('.drag-handle');if(!h||e.button!==0)return;const item=h.closest('[data-drag-type]');if(!item)return;
 e.preventDefault();
 dragState={pointer:true,type:item.dataset.dragType,id:item.dataset.id,item,handle:h,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,active:false,targetId:null,insertAfter:false};
 try{h.setPointerCapture?.(e.pointerId)}catch(err){}
}
function pointerDragMove(e){
 if(!dragState?.pointer||e.pointerId!==dragState.pointerId)return;dragState.x=e.clientX;dragState.y=e.clientY;
 if(!dragState.active&&Math.hypot(e.clientX-dragState.startX,e.clientY-dragState.startY)<8)return;
 e.preventDefault();
 if(!dragState.active){dragState.active=true;dragState.item.classList.add('dragging');const g=dragState.item.cloneNode(true);g.classList.add('drag-ghost');g.querySelectorAll('input,select,textarea,button').forEach(x=>x.tabIndex=-1);const r=dragState.item.getBoundingClientRect();g.style.width=Math.min(r.width,innerWidth-16)+'px';g.style.height=r.height+'px';document.body.appendChild(g);dragState.ghost=g;announce('Reordering. Move to a new position and release to place.');}
 if(dragState.ghost){dragState.ghost.style.left=Math.max(8,Math.min(innerWidth-dragState.ghost.offsetWidth-8,e.clientX-34))+'px';dragState.ghost.style.top=Math.max(8,Math.min(innerHeight-dragState.ghost.offsetHeight-8,e.clientY-24))+'px'}
 document.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'));
 if(dragState.ghost)dragState.ghost.hidden=true;const under=document.elementFromPoint(e.clientX,e.clientY);if(dragState.ghost)dragState.ghost.hidden=false;
 const list=dragItems(dragState.type).filter(x=>x.dataset.id!==dragState.id);let target=under?.closest?.(`[data-drag-type="${dragState.type}"]`);
 if(!target||target.dataset.id===dragState.id){target=list.sort((a,b)=>Math.abs((a.getBoundingClientRect().top+a.getBoundingClientRect().height/2)-e.clientY)-Math.abs((b.getBoundingClientRect().top+b.getBoundingClientRect().height/2)-e.clientY))[0]||null}
 if(target&&target.dataset.id!==dragState.id){const r=target.getBoundingClientRect(),th=target.querySelector('.drag-handle'),hr=th?.getBoundingClientRect(),pivot=hr?hr.top+hr.height/2:r.top+r.height/2,after=e.clientY>pivot;target.classList.add(after?'drop-after':'drop-before');dragState.targetId=target.dataset.id;dragState.insertAfter=after}else{dragState.targetId=null}
 const ws=$('#workspace');if(e.clientY<125)ws?.scrollBy({top:-16});else if(e.clientY>innerHeight-88)ws?.scrollBy({top:16});
}
function commitPointerReorder(arr,d,label){const from=arr.findIndex(x=>x.id===d.id),target=arr.findIndex(x=>x.id===d.targetId);if(from<0||target<0)return false;const [item]=arr.splice(from,1);let to=target;if(from<target)to--;if(d.insertAfter)to++;to=Math.max(0,Math.min(arr.length,to));arr.splice(to,0,item);if(to===from)return false;markDirty();cleanupPointerDrag();render();requestAnimationFrame(()=>document.querySelector(`[data-id="${CSS.escape(d.id)}"] .drag-handle`)?.focus());announce(`${label} moved to position ${to+1}.`);return true}
function pointerDragUp(e){
 if(!dragState?.pointer||e.pointerId!==dragState.pointerId)return;const d=dragState;if(d.active&&d.targetId&&d.targetId!==d.id){if(d.type==='stanza-slot'&&commitPointerReorder(stanza(state.selectedStanzaId).slots,d,'Slot'))return;if(d.type==='flow'&&commitPointerReorder(project.flow,d,'Flow entry'))return}cleanupPointerDrag();
}
const menuObserver=new MutationObserver(()=>enhanceMenus());menuObserver.observe(document.body,{subtree:true,childList:true});
document.addEventListener('pointerdown',menuPointerDown,true);
document.addEventListener('click',menuClickCapture,true);
document.addEventListener('keydown',menuKeydown,true);
document.addEventListener('pointerdown',pointerDragDown);
document.addEventListener('pointermove',pointerDragMove,{passive:false});
document.addEventListener('pointerup',pointerDragUp);
document.addEventListener('pointercancel',cleanupPointerDrag);

document.addEventListener('click',handleClick);
document.addEventListener('change',handleChange);$('#workspace')?.addEventListener('scroll',handlePerformanceScroll,{passive:true});
document.addEventListener('input',handleInput);
document.addEventListener('keydown',e=>{
 dialogKeydown(e);
 if(!$('#dialogBackdrop').hidden)return;
 if(mobilePanelKeydown(e))return;
 const mod=e.ctrlKey||e.metaKey;if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject()}if(mod&&e.key.toLowerCase()==='o'){e.preventDefault();openProject()}
});
$('#importFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)importFile(f);e.target.value=''});
window.addEventListener('resize',()=>{const bp=innerWidth<=720;if(bp!==state.breakpoint){state.breakpoint=bp;state.mobilePane=null;render()}});
function initializeScenario(id){
 if(!id)return;
 repairSelection();
 if(['surface-unmix','unmix-changed','unmix-missing','takes-many','performance-selection','performance-unmix'].includes(id)){
  state.tick=12;const rec=generateEvent();if(rec){state.selectedSurfaceId=rec.id;if(id!=='performance-selection'){state.performanceTab='unmix';state.unmixRecordId=rec.id}
   if(id==='unmix-changed'){const first=rec.trace.inputs?.[0]?.material?.id,rm=rawMaterial(first);if(rm)rm.literal=rm.literal+' (edited after generation)'}
   if(id==='unmix-missing'){const rid=rec.trace.route.id,ins=instrument(rec.trace.route.parentId);if(ins)ins.routes=ins.routes.filter(x=>x.id!==rid)}
   if(id==='takes-many'){for(let i=0;i<5;i++){const r=i?generateEvent():rec;if(r)project.takes.push({id:'take_fixture_'+i,recordId:r.id,record:clone(r),text:r.text,status:['kept','repair','residue'][i%3],pinned:i===0,note:i===1?'Repair the final cadence.':'',capturedAt:new Date(Date.now()-i*60000).toISOString()})}state.selectedTakeId=project.takes[0]?.id;state.performanceTab='takes'}
   if(isNarrow()){if(['surface-unmix','performance-unmix','unmix-changed','unmix-missing'].includes(id))state.mobilePerformancePanel='unmix';if(id==='takes-many')state.mobilePerformancePanel='takes'}
  }
 }
 if(id==='archive-interactive'){state.previewMode='interactive'}
 if(id==='archive-static'){state.previewMode='static'}
 if(id==='archive-preview-mobile'){state.previewMode='interactive';state.tick=4;for(let i=0;i<4;i++)generateEvent();state.previewHtml=buildArtifact('interactive');state.previewFresh=true}
 if(id==='archive-preview-long'){state.previewMode='static';state.previewHtml=buildArtifact('static');state.previewFresh=true}
 if(id==='runtime-empty'){project.surface=[];project.surfaceWindow=[];project.takes=[]}
 if(id==='last-condition-removal'){state.chamber='automation';const r=project.rules[0];r.conditions=r.conditions.slice(0,1);state.selectedRuleId=r.id}
 if(id==='last-route-removal'){state.chamber='instruments';const ins=project.instruments[0];ins.routes=ins.routes.slice(0,1);state.selectedInstrumentId=ins.id}
 if(id==='last-flow-removal'){state.chamber='composition';state.compositionMode='flow';project.flow=project.flow.slice(0,1)}
 if(id==='last-bank-removal'){state.chamber='materials';project.banks=project.banks.slice(0,1);const only=project.banks[0];project.instruments.forEach(ins=>ins.inputs.forEach(inp=>inp.bankId=only?.id||''));project.rules=[];state.selectedBankId=only?.id||null;state.selectedMaterialId=only?.materials[0]?.id||null}
 if(id==='last-material-removal'){state.chamber='materials';const b=project.banks[0];b.materials=b.materials.slice(0,1);project.rules=[];state.selectedBankId=b.id;state.selectedMaterialId=b.materials[0]?.id||null}
 if(id==='last-instrument-removal'){state.chamber='instruments';project.instruments=project.instruments.slice(0,1);const only=project.instruments[0]?.id;project.stanzas.forEach(st=>st.slots=st.slots.filter(sl=>sl.type==='breath'||sl.instrumentId===only));project.rules=project.rules.filter(r=>!r.conditions.some(c=>c.field==='instrument'&&c.value!==only));state.selectedInstrumentId=only||null}
 if(id==='last-input-removal'){state.chamber='instruments';const ins=project.instruments[0];ins.inputs=ins.inputs.slice(0,1);ins.routes=[{id:'r_last_input',name:'Single-input boundary route',weight:1,template:'{'+ins.inputs[0].name+'}.'}];state.selectedInstrumentId=ins.id}
 if(id==='last-stanza-removal'){state.chamber='composition';project.stanzas=project.stanzas.slice(0,1);project.flow.forEach(f=>f.stanzaId=project.stanzas[0]?.id||'');state.selectedStanzaId=project.stanzas[0]?.id||null}
 if(id==='last-slot-removal'){state.chamber='composition';const st=project.stanzas[0];st.slots=st.slots.slice(0,1);state.selectedStanzaId=st.id}
 if(id==='last-rule-removal'){state.chamber='automation';project.rules=project.rules.slice(0,1);state.selectedRuleId=project.rules[0]?.id||null}
 if(id==='last-take-removal'){state.chamber='performance';const rec=generateEvent();if(rec){project.takes=[{id:'take_last',recordId:rec.id,record:clone(rec),text:rec.text,status:'kept',pinned:false,note:'',capturedAt:new Date().toISOString()}];state.selectedTakeId='take_last';state.performanceTab='takes'}}
 repairSelection();
}
function presentScenarioOverlay(id){
 if(id==='open-invalid')requestAnimationFrame(()=>openDialog('Open project failed','<div class="error">The selected file is valid JSON but does not contain TAROKE Banks, Instruments, Stanzas, Flow, and Rules. The current project remains unchanged.</div>',{compact:true}));
 if(id==='save-failed')requestAnimationFrame(()=>openDialog('Save project failed','<div class="error">The browser could not write the project file. Unsaved changes remain in this session; choose another location or use the download fallback.</div>',{compact:true}));
 if(id==='unsaved-open')requestAnimationFrame(()=>{state.dirty=true;updateProjectBar();requestOpenProject()});
 if(id==='project-recovered')setTimeout(()=>showNotice('Recovered unsaved browser session. Save project to create a file.'),0);
 if(id==='bank-delete-dependencies')requestAnimationFrame(()=>document.querySelector('[data-action="delete-bank"]')?.click());
 if(id==='material-delete-dependencies')requestAnimationFrame(()=>document.querySelector('[data-action="delete-material"]')?.click());
 if(id==='instrument-delete-dependencies')requestAnimationFrame(()=>document.querySelector('[data-action="delete-instrument"]')?.click());
 if(id==='stanza-delete-dependencies')requestAnimationFrame(()=>document.querySelector('[data-action="delete-stanza"]')?.click());
 if(id==='delete-conflict')requestAnimationFrame(()=>openDialog('Remove Input','<p>Input <strong>{above}</strong> is used by Crossing and Under weather. Removing it leaves both Routes unresolved and disables PATH until repaired.</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-action="close-dialog">Cancel</button><button class="btn danger" data-action="close-dialog">Remove Input</button></div>',{compact:true}));
 if(id==='undo-toast')requestAnimationFrame(()=>showToast('Material removed.'));
 if(id==='mobile-action-sheet')requestAnimationFrame(()=>{const openRouteMenu=()=>document.querySelector('.route-card details.action-menu summary')?.click();if(isNarrow()&&document.querySelector('[data-action="select-instrument"]')){document.querySelector('[data-action="select-instrument"]')?.click();requestAnimationFrame(openRouteMenu)}else openRouteMenu()});
 if(id==='archive-preview-mobile'||id==='archive-preview-long')requestAnimationFrame(()=>{if(isNarrow()){state.mobilePreviewOpen=true;render();requestAnimationFrame(()=>$('#mobilePreviewTitle')?.focus())}});
}
initializeScenario(scenarioId);
repairSelection();render();enhanceMenus();presentScenarioOverlay(scenarioId);
if(recoveryRejected&&!scenarioId)requestAnimationFrame(()=>showNotice('Browser recovery copy was corrupt and was ignored; the bundled project was opened instead.'));if(recoveryUnavailable&&!scenarioId)requestAnimationFrame(()=>showNotice('Browser recovery storage is unavailable in this context; the bundled project was opened. Save a project file to keep durable work.'));
if(recoveredFromBrowser&&!scenarioId)setTimeout(()=>showNotice('Recovered unsaved browser session. Save project to create a file.'),0);
})();
</script>
